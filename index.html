<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>whisper — anonim sohbet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- Giriş Ekranı -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1 class="logo">whis<span>per</span></h1>
    <p class="tagline">anonim · anlık · izsizsiz<br>kimlik yok, kayıt yok, geçmiş yok</p>

    <div class="input-group">
      <label for="nickInput">TAKMA ADINIZI SEÇİN</label>
      <input
        type="text"
        id="nickInput"
        placeholder="örn. gece_yarisi"
        maxlength="20"
        autocomplete="off"
        spellcheck="false"
      />
      <span id="loginError" class="error-msg"></span>
      <button id="joinBtn">odaya gir</button>
    </div>

    <p class="note">hiçbir veri saklanmaz · oturum kapatınca silinir</p>
  </div>
</div>

<!-- Chat Ekranı -->
<div id="chatScreen" class="chat-screen hidden">
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-small">whisper</span>
    </div>
    <div class="room-item active">
      <span class="hash">#</span> genel
    </div>
    <div class="users-section">
      <p class="section-label">ÇEVRİMİÇİ — <span id="userCount">0</span></p>
      <ul id="userList"></ul>
    </div>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <div>
        <span class="channel-name"># genel</span>
        <span class="channel-desc">herkese açık oda</span>
      </div>
      <div class="header-right">
        <span id="myNickBadge" class="my-nick-badge"></span>
        <button id="leaveBtn" class="leave-btn">odadan çık</button>
      </div>
    </header>

    <div id="messages" class="messages"></div>

    <footer class="input-footer">
      <textarea
        id="msgInput"
        placeholder="mesaj yaz... (Enter gönderir, Shift+Enter yeni satır)"
        rows="1"
        maxlength="500"
      ></textarea>
      <button id="sendBtn" class="send-btn" title="Gönder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </footer>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/chat.js"></script>
</body>
</html>
